detector:
  weights_path: weights/detector_best.pt
  confidence: 0.25
  iou: 0.45
  imgsz: 640
  device: "auto"
  crop_left_fraction: 0.4
  crop_right_fraction: 1.0
  crop_top_fraction: 0.0
  crop_bottom_fraction: 1.0

tracking:
  match_distance_px: 80.0
  halt_distance_px: 8.0
  halt_resume_distance_px: 16.0
  halt_confirm_sec: 1.0
  max_missed_frames: 5
  missed_track_memory_sec: 0.6
  halted_track_memory_sec: 2.0
  emergency_memory_sec: 3.0
  class_mismatch_distance_penalty_px: 20.0
  starting_track_id: 101
  lane_assignment_anchor: bottom_center
  require_lane_polygon_match: false

calibration:
  alpha: 1.0
  exponent: 1.0

signal:
  total_cycle_time: 120.0
  orange_time: 5.0
  minimum_green_time: 5.0
  lane_order: [N, E, S, W]

rl:
  checkpoint_path: weights/rl_latest.pt
  state_dim: 16
  action_dim: 2
  hidden_layers: [128, 64]
  device: "auto"
  max_queue: 50.0
  max_wait: 200.0
  initial_action: 0

vehicle_keywords:
  - ambulance
  - emergency vehicle
  - auto-rikshaw
  - auto-rickshaw
  - bus
  - car
  - police vehicle
  - truck

emergency_keywords:
  - ambulance
  - fire truck
  - fire_engine
  - emergency

# Optional polygons for N/E/S/W lane assignment.
# If omitted, the project falls back to a compass split around the frame center.
# lane_polygons:
#   N:
#     - [0.35, 0.0]
#     - [0.65, 0.0]
#     - [0.55, 0.45]
#     - [0.45, 0.45]
