detector:
  weights_path: weights/best.pt
  confidence: 0.25
  iou: 0.45
  imgsz: 640
  device: "0"

tracking:
  match_distance_px: 80.0
  halt_distance_px: 8.0
  max_missed_frames: 5
  starting_track_id: 101

calibration:
  alpha: 1.0
  exponent: 1.0

signal:
  total_cycle_time: 120.0
  orange_time: 5.0
  minimum_green_time: 5.0
  lane_order: [N, E, S, W]

vehicle_keywords:
  - ambulance
  - emergency vehicle
  - auto-rikshaw
  - auto-rickshaw
  - bus
  - car
  - police vehicle
  - truck

emergency_keywords:
  - ambulance
  - fire truck
  - fire_engine
  - emergency

